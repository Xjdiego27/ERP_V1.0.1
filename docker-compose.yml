# ═══════════════════════════════════════════════════════════════
# Docker Compose — ERP Sistema Login V1.0.1
# Infraestructura blindada para Windows Server (Docker Engine)
#
# Arquitectura de red (erp-net bridge aislada):
#
#   ┌───────────── erp-net (172.28.0.0/16) ─────────────┐
#   │                                                     │
#   │   mysql ◄──── backend ────► mongo                   │
#   │   (sin ports)  :8000        (sin ports)             │
#   │                  ▲            ▲                     │
#   │                  │            │                     │
#   │   mysql ◄──── chat ──────► mongo ◄── huellero       │
#   │              (sin ports)         (sin ports/LAN)    │
#   │                  ▲                                  │
#   │                  │ proxy interno                    │
#   │            ┌─────┴─────┐                            │
#   │            │ frontend  │                            │
#   │            │ Nginx :80 │                            │
#   │            └───────────┘                            │
#   └─────────────────────────────────────────────────────┘
#
# Puertos expuestos al host:
#   80   → Frontend Nginx + reverse proxy chat (/chat/, /socket.io/)
#   8000 → Backend API (FastAPI)
#
# Puertos BLOQUEADOS (solo red interna):
#   3306  → MySQL
#   27017 → MongoDB
#   8001  → Chat Backend
#
# Uso:
#   1. Copiar .env.example → .env y configurar
#   2. docker compose up -d --build
#   3. docker compose logs -f backend
#   4. docker compose down
# ═══════════════════════════════════════════════════════════════

services:

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # MySQL 8 — Base de datos principal
  # ⛔ SIN puertos expuestos al host
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  mysql:
    image: mysql:8.0
    container_name: erp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    # ⛔ Sin 'ports' — aislado en erp-net
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - erp-net

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # MongoDB 7 — Base de datos NoSQL
  # ⛔ SIN puertos expuestos al host
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  mongo:
    image: mongo:7
    container_name: erp-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    # ⛔ Sin 'ports' — aislado en erp-net
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --quiet --eval 'db.adminCommand({ping:1}).ok' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - erp-net

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Backend API — FastAPI
  # ✅ Puerto 8000 expuesto al host
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erp-backend
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: "3306"
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${TOKEN_EXPIRE:-480}
      MONGO_URL: "mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin"
      MONGO_DB_NAME: ${MONGO_DB_NAME:-erp_nosql}
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      CORS_ORIGINS: ${CORS_ORIGINS}
    volumes:
      - shared_assets:/app/public/assets
    networks:
      - erp-net

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Chat Backend — FastAPI + Socket.IO
  # ⛔ SIN puertos expuestos (acceso via Nginx)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  chat:
    build:
      context: ./chat_backend
      dockerfile: Dockerfile
    container_name: erp-chat
    restart: unless-stopped
    # ⛔ Sin 'ports' — solo accesible via Nginx reverse proxy
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: "3306"
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      MONGO_URL: "mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin"
      MONGO_DB_NAME: ${MONGO_DB_NAME:-erp_nosql}
      CHAT_PORT: "8001"
      CORS_ORIGINS: ${CORS_ORIGINS}
    volumes:
      - chat_uploads:/app/uploads
    networks:
      - erp-net

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Frontend — Vite React → Nginx
  # ✅ Puerto 80 expuesto al host
  # Nginx también actúa como reverse proxy
  # para el chat backend (/chat/, /socket.io/)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  frontend:
    build:
      context: ./erp-poo
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_CHAT_URL: ${VITE_CHAT_URL:-}
    container_name: erp-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
      - chat
    volumes:
      - shared_assets:/usr/share/nginx/html/assets
    networks:
      - erp-net

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Huellero — Sincronización ZK (reloj biométrico)
  # ⛔ SIN puertos expuestos — solo accede a MongoDB
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  huellero:
    build:
      context: ./HUELLERO
      dockerfile: Dockerfile
    container_name: erp-huellero
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      HUELLERO_IP: ${HUELLERO_IP:-192.168.1.254}
      HUELLERO_PORT: ${HUELLERO_PORT:-4370}
      MONGO_URI: "mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin"
      MONGO_DB_NAME: ${MONGO_DB_NAME:-erp_nosql}
      MONGO_COLECCION: ${MONGO_COLECCION:-asistencia}
    # ⛔ Sin 'ports' — no expone nada, solo conecta al huellero y escribe en MongoDB
    networks:
      - erp-net
    # El contenedor necesita acceso a la red local del huellero
    # Si el huellero está en la LAN del host, usar network_mode o extra_hosts
    extra_hosts:
      - "host.docker.internal:host-gateway"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Volúmenes persistentes (datos sobreviven
# a docker compose down / reinicio)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
volumes:
  mysql_data:
    driver: local
  mongo_data:
    driver: local
  chat_uploads:
    driver: local
  shared_assets:
    driver: local

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Red bridge aislada — comunicación interna
# Subnet configurable vía .env
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
networks:
  erp-net:
    driver: bridge
    ipam:
      config:
        - subnet: ${NETWORK_SUBNET:-172.28.0.0/16}