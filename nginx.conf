# ═══════════════════════════════════════════════════════════
# Nginx — Reverse Proxy para ERP Sistema Login
#
# Arquitectura:
#   Puerto 80  → Frontend (archivos estáticos de Vite build)
#   /api/      → Backend FastAPI (localhost:4000)
#   /chat/     → Chat Backend (localhost:4001)
#   /socket.io/→ Chat WebSocket (localhost:4001)
#
# Instalación en el servidor:
#   1. Copiar este archivo a /etc/nginx/sites-available/erp
#   2. Enlazar:  sudo ln -s /etc/nginx/sites-available/erp /etc/nginx/sites-enabled/
#   3. Eliminar default:  sudo rm /etc/nginx/sites-enabled/default
#   4. Probar:   sudo nginx -t
#   5. Recargar: sudo systemctl reload nginx
#
# El frontend debe estar compilado:
#   cd erp-poo && npm run build
#   Copiar dist/ a /var/www/erp/
# ═══════════════════════════════════════════════════════════

server {
    listen 80;
    server_name _;

    # ── Tamaño máximo de subida (fotos, documentos) ──
    client_max_body_size 25M;

    # ── Logs ──
    access_log /var/log/nginx/erp_access.log;
    error_log  /var/log/nginx/erp_error.log;

    # ── Compresión gzip ──
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 256;

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # Frontend — Archivos estáticos (Vite build)
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    root /var/www/erp;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache para assets estáticos (JS, CSS, imágenes)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # Backend API — FastAPI (puerto 4000)
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    location /api/ {
        proxy_pass http://127.0.0.1:4000/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts generosos para consultas pesadas
        proxy_read_timeout    120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
    }

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # Chat REST — FastAPI (puerto 4001)
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    location /chat/ {
        proxy_pass http://127.0.0.1:4001/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout    120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
    }

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # Socket.IO — WebSocket + polling (puerto 4001)
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4001/socket.io/;
        proxy_http_version 1.1;

        # Headers para WebSocket upgrade
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout largo para mantener conexiones WebSocket abiertas
        proxy_read_timeout    86400s;
        proxy_send_timeout    86400s;
    }

    # ── Seguridad básica ──
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
}
