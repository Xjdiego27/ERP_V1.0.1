# ═══════════════════════════════════════════════════════════
# Nginx — Frontend SPA + Reverse Proxy Chat
#
# Rutas:
#   /              → SPA React (estáticos)
#   /assets/       → Assets dinámicos (volúmenes compartidos)
#   /chat/         → Proxy → chat:8001 (REST API)
#   /socket.io/    → Proxy → chat:8001 (WebSocket + polling)
#   /api/          → Proxy → backend:8000 (opcional)
# ═══════════════════════════════════════════════════════════

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Headers de Seguridad ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Ocultar versión de Nginx ──
    server_tokens off;

    # ── Compresión Gzip ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        text/javascript
        image/svg+xml
        application/wasm;

    # ── Tamaño máximo de upload (para archivos del chat) ──
    client_max_body_size 25M;

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # REVERSE PROXY: Chat Socket.IO (WebSocket + HTTP)
    # El chat backend NO tiene puerto expuesto al host.
    # Todo el tráfico pasa por aquí.
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    location /socket.io/ {
        proxy_pass http://chat:8001/socket.io/;
        proxy_http_version 1.1;

        # WebSocket upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Headers reales del cliente
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts largos para WebSocket
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # REVERSE PROXY: Chat REST API
    # /chat/contactos → chat:8001/contactos
    # /chat/mensajes  → chat:8001/mensajes
    # /chat/upload    → chat:8001/upload
    # etc.
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    location /chat/ {
        proxy_pass http://chat:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # REVERSE PROXY: Backend API (opcional)
    # El backend YA está en el puerto 8000 expuesto.
    # Este proxy permite acceder también via /api/
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Cache de assets estáticos (JS, CSS, imágenes del build) ──
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── SPA fallback — React Router ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Bloquear acceso a archivos ocultos ──
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
